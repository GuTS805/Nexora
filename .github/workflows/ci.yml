name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (a moved tag cannot change what runs here);
# Dependabot keeps the pins current.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: UI smoke test (headless Chrome against the production build)
        run: npm run test:ui
      - run: npm run build:portable -w web
      - run: npm audit --audit-level=moderate
      - name: npm package packs, installs and works in a clean project
        run: |
          (cd ledger && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          echo '{"type":"module"}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/nexora-ledger-*.tgz
          node --input-type=module -e "
            import { shiftCreate } from 'nexora-ledger';
            import { validateEntity } from 'nexora-ledger/contract';
            import schema from 'nexora-ledger/schema/shift.schema.json' with { type: 'json' };
            const params = shiftCreate({ platform: 'swiggy', work: 'food_delivery', city: 'pune', vehicle: 'ev_scooter', period: 202610, grossInr: 1000, costsInr: 100, hours: 9, incentive: 'met', expiresInDays: 30 });
            const errors = validateEntity('shift', params);
            if (errors.length || !schema.\$id) { console.error(errors); process.exit(1); }
          "
          npx --no-install nexora | grep -q audit
      - name: The published npm package works for a stranger (public registry, empty config, no credentials)
        run: node scripts/registry-consumer.mjs
      - name: Portable build is one self-contained file
        run: |
          test -f web/dist-portable/nexora.html
          test "$(ls web/dist-portable | wc -l)" -eq 1
          ! grep -q '<script[^>]*src=' web/dist-portable/nexora.html
      # A union passing nexora.html around can check it is the file CI built, not a modified copy.
      - name: Checksum for the portable file
        run: |
          mkdir -p "$RUNNER_TEMP/portable"
          cp web/dist-portable/nexora.html "$RUNNER_TEMP/portable/"
          (cd "$RUNNER_TEMP/portable" && sha256sum nexora.html > nexora.html.sha256 && cat nexora.html.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexora-portable
          path: ${{ runner.temp }}/portable/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
