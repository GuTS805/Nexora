name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: UI smoke test (headless Chrome against the production build)
        run: npm run test:ui
      - run: npm run build:portable -w web
      - run: npm audit --audit-level=moderate
      - name: Portable build is one self-contained file
        run: |
          test -f web/dist-portable/nexora.html
          test "$(ls web/dist-portable | wc -l)" -eq 1
          ! grep -q '<script[^>]*src=' web/dist-portable/nexora.html
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-portable
          path: web/dist-portable/nexora.html
