name: privacy audit

# Holds every Nexora entity on Arkiv Tiramisu to the published JSON Schemas and scans it for
# personal data. Runs against live chain data, so it is separate from CI: a failure here means
# something on chain, not in the code, needs attention.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ledger/**", "arkiv/schema/**", ".github/workflows/audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit live data
        # Optional repository secret: the public RPC with an Arkiv Hub key appended. Without it the
        # public endpoint is used, which can rate-limit shared runner IPs.
        env:
          ARKIV_RPC_URL: ${{ secrets.ARKIV_RPC_URL }}
        run: npm run cli -- audit
