name: Bug report
description: Something in the app, CLI or data contract does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not paste wallet keys, passphrases or anyone's personal details. Security or privacy problems go to a private advisory (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: "Page URL, CLI command, or entity key (0x…)"
  - type: input
    id: env
    attributes:
      label: Browser / OS / Node version
